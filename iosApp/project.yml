name: QuemSouEu
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: SRN7AW424S
targets:
  QuemSouEu:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/KnowledgeBase
        type: folder
        buildPhase: resources
      - path: Resources/Characters
        type: folder
        buildPhase: resources
      - path: ../docs/content/image-credits.json
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Logo.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.quemsoueu.adivinha
        PRODUCT_NAME: "Quem Sou Eu? Adivinha"
        PRODUCT_MODULE_NAME: QuemSouEu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: 1.2
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - QuemSouEuTests
  QuemSouEuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: QuemSouEu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.quemsoueu.adivinha.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quem Sou Eu? Adivinha.app/Quem Sou Eu? Adivinha"
        BUNDLE_LOADER: "$(TEST_HOST)"
