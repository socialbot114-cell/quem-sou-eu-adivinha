<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}body{margin:0;background:#f4f1fb;color:#17113d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:1242px;height:2688px;padding:90px 64px;overflow:hidden}.soft{background:#f4f1fb}.ink{background:#17113d;color:#fff}.title{font-size:72px;font-weight:800;line-height:1.06;margin:40px 0 14px}.subtitle{font-size:32px;color:#665f7e;margin-bottom:42px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{height:300px;background:#fff;border-radius:32px;padding:42px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 24px #17113d10}.card b{font-size:30px;margin-top:20px}.icon{font-size:84px}.lime{background:#baff2c}.purple{color:#8a4cff}.top{display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:700}.close{width:64px;height:64px;border-radius:50%;background:#ffffff1c;display:grid;place-items:center}.bar{height:14px;border-radius:10px;background:#ffffff30;margin-top:22px}.bar i{display:block;width:30%;height:100%;background:#baff2c;border-radius:10px}.spacer{height:250px}.question{background:#fff;color:#17113d;border-radius:34px;padding:58px 40px;text-align:center}.question .mascot{font-size:110px}.question h2{font-size:54px;line-height:1.1;margin:28px 0 42px}.answer{padding:24px;border-radius:50px;margin:14px 0;font-size:30px;font-weight:700}.yes{background:#baff2c}.prob{background:#d8f2d4}.unknown{background:#eeeef2}.no{background:#ffe0e8}.result{margin-top:360px;background:#fff;color:#17113d;border-radius:34px;padding:54px 42px;text-align:center}.result .avatar{font-size:150px;color:#8a4cff;background:#baff2c;width:250px;height:250px;border-radius:50%;display:grid;place-items:center;margin:30px auto}.result h2{font-size:48px;margin:18px}.result p{font-size:30px;color:#665f7e}.button{background:#8a4cff;color:#fff;border-radius:50px;font-size:30px;font-weight:700;padding:25px;margin-top:25px}
</style>
<script>
const view=location.hash.slice(1)||'categories';
const category=(icon,name,extra='')=>`<div class="card ${extra}"><div class="icon">${icon}</div><b>${name}</b></div>`;
let html='';
if(view==='categories') html=`<main class="soft"><div class="title">Escolha uma categoria</div><div class="subtitle">Pense em alguém e eu descubro!</div><div class="grid">${category('▶','TikTok')}${category('◎','Instagram')}${category('⚽','Futebol')}${category('♫','Artistas brasileiros')}${category('▥','Políticos')}${category('◷','História')}${category('◉','Personalidades mundiais')}${category('✦','Todos','lime')}</div></main>`;
if(view==='question') html=`<main class="ink"><div class="top"><div class="close">×</div><span>Pergunta 3 de 10</span></div><div class="bar"><i></i></div><div class="spacer"></div><section class="question"><div class="mascot">🔍</div><h2>É brasileiro?</h2><div class="answer yes">Sim</div><div class="answer prob">Provavelmente sim</div><div class="answer unknown">Não sei</div><div class="answer no">Provavelmente não</div><div class="answer no">Não</div></section></main>`;
if(view==='result') html=`<main class="ink"><div class="top"><div class="close">×</div><span>Resultado</span></div><section class="result"><div style="font-size:36px;font-weight:700">Acho que descobri!</div><div class="avatar">♟</div><h2>Rafa Lima</h2><p>Brasil • Jogador de futebol</p><p style="color:#17113d;font-weight:700">Descobri em 6 perguntas</p><div class="button">Sim, acertou!</div></section></main>`;
if(view==='progress') html=`<main class="soft"><div class="title">Meu progresso</div><div class="subtitle">Suas conquistas ficam neste aparelho.</div><div class="grid">${category('🔥','3\nsequência')}${category('♛','120\npontos','lime')}</div></main>`;
document.write(html);
</script>
</html>
