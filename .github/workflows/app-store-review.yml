name: App Store Connect Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect App Store Connect or submit the version below for review
        required: true
        type: choice
        options:
          - inspect
          - submit
        default: inspect
      app_version:
        description: Marketing version to inspect or submit
        required: true
        type: string
        default: "1.2.4"
      build_number:
        description: TestFlight build number (GitHub run number of the iOS TestFlight workflow); required to submit
        required: false
        type: string
      confirm_submission:
        description: Enter SUBMIT <version> (<build>), e.g. SUBMIT 1.2.4 (12), to submit for App Review
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-store-release-${{ inputs.app_version }}
  cancel-in-progress: false

jobs:
  app-store:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5

      - name: Validate requested operation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM_SUBMISSION: ${{ inputs.confirm_submission }}
          APP_VERSION_STRING: ${{ inputs.app_version }}
          APP_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" != "inspect" && "$OPERATION" != "submit" ]]; then
            printf 'Unsupported operation: %s\n' "$OPERATION" >&2
            exit 1
          fi
          if [[ ! "$APP_VERSION_STRING" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            printf 'Invalid app version: %s\n' "$APP_VERSION_STRING" >&2
            exit 1
          fi
          if [[ "$OPERATION" == "submit" ]]; then
            if [[ ! "$APP_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
              printf 'Submission requires a numeric build_number.\n' >&2
              exit 1
            fi
            expected="SUBMIT ${APP_VERSION_STRING} (${APP_BUILD_NUMBER})"
            if [[ "$CONFIRM_SUBMISSION" != "$expected" ]]; then
              printf 'Submission requires the exact confirmation: %s\n' "$expected" >&2
              exit 1
            fi
          fi

      - name: Validate App Store Connect secrets
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for secret_name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!secret_name:-}" ]]; then
              printf 'Required secret %s is not configured.\n' "$secret_name" >&2
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependency
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]'

      - name: Validate screenshot package
        run: python scripts/app_store_connect_release.py validate-assets store-kit/screenshots/iphone

      - name: Inspect or submit App Store version
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APP_STORE_PROCESSING_TIMEOUT_MINUTES: "30"
          APP_STORE_ASSET_TIMEOUT_MINUTES: "20"
          APP_STORE_OPERATION: ${{ inputs.operation }}
          CONFIRM_SUBMISSION: ${{ inputs.confirm_submission }}
          APP_VERSION_STRING: ${{ inputs.app_version }}
          APP_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python scripts/app_store_connect_release.py "$APP_STORE_OPERATION" store-kit/screenshots/iphone
