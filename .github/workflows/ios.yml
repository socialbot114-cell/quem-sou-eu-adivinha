name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_xcode_cloud:
        description: Trigger the connected Xcode Cloud production workflow after simulator tests
        required: true
        type: boolean
        default: false
      xcode_cloud_workflow_name:
        description: Exact workflow name if the App Store Connect product has multiple enabled workflows
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate content
        run: python3 scripts/validate_content.py

      - name: Evaluate offline engine
        run: |
          set -euo pipefail
          python3 scripts/evaluate_offline.py --seed 42 --report "$RUNNER_TEMP/eval.json"
          python3 - "$RUNNER_TEMP/eval.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          ideal = report["summary"]["perScenario"]["ideal"]
          assert ideal["firstGuessAccuracy"] >= 0.90, f"ideal first-guess accuracy too low: {ideal['firstGuessAccuracy']}"
          print("Offline engine evaluation passed:", ideal)
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml

      - name: Select available iPhone simulator
        run: |
          set -euo pipefail
          simulator_udid="$(
            xcrun simctl list devices available -j | python3 -c '
          import json
          import re
          import sys

          devices_by_runtime = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in devices_by_runtime.items():
              match = re.search(r"iOS-(\d+)(?:-(\d+))?(?:-(\d+))?$", runtime)
              version = tuple(map(int, match.groups(default="0"))) if match else (0, 0, 0)
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit("No available iPhone simulator was found")
          version, name, udid = max(candidates)
          version_text = ".".join(map(str, version))
          print(udid)
          print(f"Selected {name} on iOS {version_text}", file=sys.stderr)
          '
          )"
          test -n "$simulator_udid"
          printf 'SIMULATOR_UDID=%s\n' "$simulator_udid" >> "$GITHUB_ENV"

      - name: Build app without signing
        run: |
          set -euo pipefail
          xcodebuild build \
            -project iosApp/QuemSouEu.xcodeproj \
            -scheme QuemSouEu \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests without signing
        run: |
          set -euo pipefail
          xcodebuild test \
            -project iosApp/QuemSouEu.xcodeproj \
            -scheme QuemSouEu \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Set up Python for Xcode Cloud API
        if: ${{ inputs.run_xcode_cloud }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install App Store Connect JWT dependency
        if: ${{ inputs.run_xcode_cloud }}
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]'

      - name: Trigger and verify Xcode Cloud build
        if: ${{ inputs.run_xcode_cloud }}
        run: python scripts/trigger_xcode_cloud_build.py
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          XCODE_CLOUD_WORKFLOW_NAME: ${{ inputs.xcode_cloud_workflow_name }}
          XCODE_CLOUD_RUN_TIMEOUT_MINUTES: "90"
          APP_STORE_PROCESSING_TIMEOUT_MINUTES: "45"
