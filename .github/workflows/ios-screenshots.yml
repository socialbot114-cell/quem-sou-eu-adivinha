name: Quem Sou Eu iOS Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    strategy:
      matrix:
        device:
          - name: iPhone 17
            slug: iphone
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml
      - name: Select and boot simulator
        env:
          SIMULATOR_NAME: ${{ matrix.device.name }}
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          name = os.environ["SIMULATOR_NAME"]
          devices = json.load(sys.stdin)["devices"]
          matches = [device["udid"] for group in devices.values() for device in group if device.get("isAvailable") and device.get("name") == name]
          if not matches:
              raise SystemExit(f"No available simulator named {name}")
          print(matches[0])
          ')"
          printf 'SIMULATOR_UDID=%s\n' "$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
      - name: Record demo and capture screenshots
        working-directory: iosApp
        env:
          DEVICE_SLUG: ${{ matrix.device.slug }}
        run: |
          set -euo pipefail
          video_path="$RUNNER_TEMP/quem-sou-eu-demo-${DEVICE_SLUG}.mp4"
          result_path="$RUNNER_TEMP/quem-sou-eu-${DEVICE_SLUG}.xcresult"
          screenshots_path="$RUNNER_TEMP/quem-sou-eu-screenshots-${DEVICE_SLUG}"
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 "$video_path" &
          recorder_pid=$!
          set +e
          xcodebuild test \
            -project QuemSouEu.xcodeproj \
            -scheme QuemSouEu \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$result_path" \
            -only-testing:QuemSouEuUITests \
            CODE_SIGNING_ALLOWED=NO
          test_status=$?
          set -e
          kill -INT "$recorder_pid" 2>/dev/null || true
          wait "$recorder_pid" 2>/dev/null || true
          if [[ -d "$result_path" ]]; then
            xcrun xcresulttool export attachments \
              --path "$result_path" \
              --output-path "$screenshots_path"
          fi
          if [[ "$test_status" -ne 0 ]]; then
            exit "$test_status"
          fi
          test -s "$video_path"
          test -d "$screenshots_path"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quem-sou-eu-ios-media-${{ matrix.device.slug }}
          path: |
            ${{ runner.temp }}/quem-sou-eu-screenshots-${{ matrix.device.slug }}
            ${{ runner.temp }}/quem-sou-eu-demo-${{ matrix.device.slug }}.mp4
          if-no-files-found: warn
          retention-days: 14
